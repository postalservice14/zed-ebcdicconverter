name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included because the URI-to-path conversion has a drive-letter branch and
        # the binary is shipped for Windows.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel; installing via rustup honours it automatically.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  extension:
    name: Extension (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - run: cargo build --release --target wasm32-wasip2

  tables:
    name: Generated tables match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Guards the correctness story: if server/src/tables.rs ever drifts from what upstream's
      # TypeScript produces -- by a hand edit, or an upstream change -- this fails.
      - name: Verify tables.rs is derived from upstream
        run: python3 tools/gen_tables.py --check
